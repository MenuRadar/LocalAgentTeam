name: Package LocalAgentTeam

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create distributable ZIP
        run: |
          mkdir -p dist
          zip -r dist/LocalAgentTeam-Windows.zip .             -x ".git/*"             -x ".github/*"             -x "dist/*"             -x "__pycache__/*"             -x "*.pyc"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LocalAgentTeam-Windows
          path: dist/LocalAgentTeam-Windows.zip
          retention-days: 30
